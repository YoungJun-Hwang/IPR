<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>실제 상품 자료 수집</title><style>body{width:360px;font:13px system-ui;padding:16px;color:#294a34;background:#f6f8f1}h1{font-size:19px}p{font-size:12px;line-height:1.7}label{display:block;margin:12px 0 5px}input,select,textarea,button{box-sizing:border-box;width:100%;padding:9px;border:1px solid #cfdbc7;border-radius:5px;font:inherit}button{margin-top:12px;background:#356343;color:white;cursor:pointer}button:disabled{opacity:.5}#message{white-space:pre-wrap}small{display:block;line-height:1.7;color:#718269}a{color:#356343}</style></head><body><h1>열어둔 실제 상품 모으기</h1><p>쿠팡 상품 상세 페이지에서 판매자 정보 창을 열어둔 뒤 읽어주세요. 현재 화면의 공개 정보만 확인하며 로그인 정보·쿠키는 수집하지 않습니다.</p><button id="read">현재 상품 정보 읽기</button><label>상품명<input id="name" readonly></label><label>판매자 상호<input id="seller-name" maxlength="150"></label><label>판매자 프로필 URL<input id="seller-url" placeholder="공개 판매자 프로필 링크"></label><label>공개 정보에서 확인한 사업자 유형<select id="type"><option value="unknown">확인 불가</option><option value="individual">개인사업자</option><option value="corporation">법인사업자</option></select></label><label>사업자 구분 근거 문구<input id="evidence" placeholder="예: 사업자 구분 : 개인사업자" maxlength="300"></label><small>화면에 명시된 유형만 선택하세요. 상호나 사업자번호만으로 추정하지 마세요. 수정한 분류는 사용자 입력으로 표시됩니다.</small><button id="capture" disabled>이 상품·대표 사진을 로컬에 저장</button><p id="message" role="status"></p><p id="count"></p><button id="download">모은 실제 자료 JSON 내려받기</button><button id="clear">이 도구의 저장 자료 지우기</button><small>최대 50개 상품·사진 합계 24MB. 사진 다운로드 권한을 요청할 수 있습니다. 캡차나 로그인 제한을 우회하지 않으며 자동으로 다른 페이지를 방문하지 않습니다. 저장 완료 전에는 이 창을 닫지 마세요.</small><script src="popup.js"></script></body></html>
