name: Run real seller scan
on:
  push:
    branches: [main]
    paths: [requests/coupang.json]
  workflow_dispatch:
    inputs:
      site_url:
        description: 공개 쇼핑몰 또는 카테고리 URL
        required: true
        default: https://www.coupang.com/
      max_products:
        description: 점검 상품 수 (1~50)
        required: true
        default: '20'
permissions:
  contents: read
concurrency:
  group: real-seller-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install verified dependencies
        run: python -m pip install -r requirements.txt
      - name: Prepare dispatch request
        if: github.event_name == 'workflow_dispatch'
        env:
          SCAN_SITE_URL: ${{ inputs.site_url }}
          SCAN_MAX_PRODUCTS: ${{ inputs.max_products }}
        run: |
          python - <<'PY'
          import os,json
          from pathlib import Path
          data={'site_url':os.environ['SCAN_SITE_URL'],'max_products':int(os.environ['SCAN_MAX_PRODUCTS']),'max_categories':3}
          Path('requests/coupang.json').write_text(json.dumps(data),encoding='utf-8')
          PY
      - name: Run actual collection (no sample fallback)
        run: python scripts/run-real-scan.py
      - name: Retain actual outcome for download (not public Pages)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-seller-report-${{ github.run_id }}
          path: artifacts/real-scan.json
          if-no-files-found: warn
          retention-days: 7
