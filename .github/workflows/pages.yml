name: Deploy GitHub Pages demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test and build standalone demo
        run: |
          node --test tests/pages/*.test.mjs
          node --check app/static/scanner.js
          node --check app/static/seller-ui.js
          node --check app/static/local-data.js
          node --check app/static/real-data-ui.js
          node --check browser-capture/popup.js
          node --test tests/real_data/*.test.mjs
          node scripts/build-pages.mjs
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
